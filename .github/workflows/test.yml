name: Terraform CI/CD
on:
  workflow_dispatch: 
    inputs:
      confirm_apply:
        description: "I authorize Terraform deployment"
        required: true
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
concurrency:
  group: terraform-state
  cancel-in-progress: false
env:
  AWS_REGION: eu-north-1
  TF_VAR_key_name: MyKeyPair
jobs:
    ci:
        name: Terraform CI
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
                   
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_version: "1.16.6"
                
            - name: Format check
              run: terraform fmt -check -recursive
              
            - name: Init
              run: terraform init -input=false -backend=false
              
            - name: Validate
              run: terraform validate
          
    plan:
      name: Terraform Plan
      runs-on: ubuntu-latest
      needs: ci
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      steps: 
          - uses: actions/checkout@v4
                 
          - name: Setup Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: "1.16.6"
              
          - name: Configure AWS credentials
            uses: aws-actions/configure-aws-credentials@v4
            with:
              aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
              aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
              aws-region: ${{ env.AWS_REGION }}
              
          - name: Verify AWS Identity
            run: aws sts get-caller-identity
            
          - name: Init
            run: terraform init -input=false
            
          - name: Terraform Plan
            run: terraform plan -var="key_name=${{ env.TF_VAR_key_name }}" -input=false -no-color -out=tfplan
            
          - name: Upload Terraform Plan
            uses: actions/upload-artifact@v4
            with:
              name: terraform-plan
              path: tfplan
              retention-days: 1
              if-no-files-found: error
    apply:
      name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirm_apply
      runs-on: ubuntu-latest
      needs: plan
      steps:
          - uses: actions/checkout@v4
                 
          - name: Setup Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: "1.16.6"
              
          - name: Configure AWS credentials
            uses: aws-actions/configure-aws-credentials@v4
            with:
              aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
              aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
              aws-region: ${{ env.AWS_REGION }}
              
          - name: Verify AWS Identity
            run: aws sts get-caller-identity
            
          - name: Init
            run: terraform init -input=false
          - name: Download Terraform Plan
            uses: actions/download-artifact@v8.0.2
            with:
               name: terraform-plan
               path: .
            
          - name: Terraform Apply
            run: terraform apply -var="key_name=${{ env.TF_VAR_key_name }}" -input=false -no-color tfplan

